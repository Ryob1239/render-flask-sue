name: CI/CD Multientorno render-flask-sue

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas Unitarias
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ejecutar Pytest
        env:
          PYTHONPATH: .
        run: python -m pytest -v test/

  despliegue_docker:
    name: Empaquetar en Docker Hub
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Comprobar credenciales de Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo '::error::Faltan DOCKER_USERNAME y/o DOCKER_PASSWORD en los Secrets del repositorio'
            exit 1
          fi

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y subir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/render-flask-sue:latest
            ${{ secrets.DOCKER_USERNAME }}/render-flask-sue:${{ github.sha }}

  despliegue_render:
    name: Desplegar en Render
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Notificar a Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo '::error::Falta el secret RENDER_DEPLOY_HOOK'
            exit 1
          fi
          http_code=$(curl --silent --show-error --max-time 30 --output /tmp/render-deploy-response.json --write-out '%{http_code}' "$RENDER_DEPLOY_HOOK") || {
            echo '::error::No se pudo contactar con Render.'
            exit 1
          }
          if [ "$http_code" = "409" ]; then
            echo '::error::Render responde 409: el servicio está suspendido o el workspace no permite iniciar despliegues. Reactiva el servicio en Render y revisa límites/facturación.'
            exit 1
          elif [ "$http_code" != "200" ] && [ "$http_code" != "202" ]; then
            echo "::error::Render respondió HTTP $http_code. Revisa el Deploy Hook y el estado del servicio."
            exit 1
          fi
          echo "Render aceptó la solicitud de despliegue (HTTP $http_code). Comprueba que el despliegue termine en Render."

  despliegue_railway:
    name: Desplegar en Railway
    needs: pruebas
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID || secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID || secrets.RAILWAY_SERVICE_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Comprobar configuración de Railway
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_PROJECT_ID" ] || [ -z "$RAILWAY_SERVICE_ID" ]; then
            echo '::error::Configura RAILWAY_TOKEN, RAILWAY_PROJECT_ID y RAILWAY_SERVICE_ID como Secrets o Variables según corresponda'
            exit 1
          fi

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: Iniciar despliegue
        # Sin --ci: esperar al resultado final del despliegue y no solo al build.
        run: |
          if ! railway up --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "${RAILWAY_ENVIRONMENT:-production}"; then
            echo '::error::Railway no pudo desplegar. Si dice "Service not found", revisa que RAILWAY_SERVICE_ID pertenezca al proyecto RAILWAY_PROJECT_ID y al entorno del token RAILWAY_TOKEN.'
            exit 1
          fi

  despliegue_azure:
    name: Desplegar en Azure App Service
    needs: pruebas  # Azure recibe código Python; NO depende de una imagen Docker.
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Verificar configuración de Azure
        env:
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME || secrets.AZURE_WEBAPP_NAME }}
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "$AZURE_WEBAPP_NAME" ]; then
            echo '::error::Falta AZURE_WEBAPP_NAME en Secrets o Variables (valor esperado: dcazure)'
            exit 1
          fi
          if [ -z "$AZURE_WEBAPP_PUBLISH_PROFILE" ]; then
            echo '::error::Falta el secret AZURE_WEBAPP_PUBLISH_PROFILE'
            exit 1
          fi

      - name: Empaquetar aplicación Python para Azure
        run: |
          zip -q -r azure-package.zip application.py app requirements.txt
          unzip -l azure-package.zip

      - name: Publicar código en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME || secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: azure-package.zip
