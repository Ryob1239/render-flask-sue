name: CI/CD Multientorno render-flask-sue

on:
  push:
    branches:
      - main

jobs:
  pruebas:
    name: Pruebas Unitarias
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Pytest
        env:
          PYTHONPATH: .
        run: pytest tests/

  despliegue_docker:
    name: Empaquetar en Docker Hub
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Construir y Subir Imagen
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/render-flask-sue:latest

  despliegue_azure:
    name: Desplegar en Azure App Service
    needs: despliegue_docker
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'tu-app-azure'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: '${{ secrets.DOCKER_USERNAME }}/render-flask-sue:latest'

  despliegue_render:
    name: Desplegar en Render
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Notificar a Render
        run: curl ${{ secrets.RENDER_DEPLOY_HOOK }}

  despliegue_railway:
    name: Desplegar en Railway
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Instalar Railway CLI
        run: npm i -g @railway/cli
      - name: Iniciar despliegue
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}